version: 2

sources:
  - name: raw
    description: Tables loaded by the Python extract scripts. Never edited by hand.
    tables:
      - name: ga4_page_traffic
        config:
          loaded_at_field: loaded_at
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 54, period: hour}
      - name: rss_articles
        config:
          loaded_at_field: extracted_at
          freshness:
            warn_after: {count: 30, period: hour}
            error_after: {count: 54, period: hour}
      - name: rss_articles_history

models:
  - name: stg_ga4__page_traffic
    columns:
      - name: report_date
        data_tests: [not_null]

  - name: stg_rss__articles
    columns:
      - name: page_path
        data_tests: [unique, not_null]
      - name: title
        data_tests: [not_null]
