name: web_analytics
version: "1.0.0"
config-version: 2
profile: web_analytics

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

vars:
  lookback_days: 3          # days rebuilt on every incremental run (GA4 revises recent data)
  calendar_start: "2026-03-01"
  site_timezone: "Europe/Istanbul"

models:
  web_analytics:
    staging:
      +materialized: view   # light cleaning, no stored copy
    marts:
      +materialized: table  # the star schema the dashboard reads
