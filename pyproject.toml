[project]
name = "web-analytics-elt"
version = "0.1.0"
description = "Daily ELT pipeline: GA4 and RSS into BigQuery, modelled with dbt, orchestrated with Airflow."
requires-python = ">=3.13,<3.14"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
